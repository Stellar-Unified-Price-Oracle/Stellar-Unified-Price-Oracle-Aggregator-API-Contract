name: Canary

# Canary deployment pipeline (#414). See docs/canary-deployment.md.
# Launch-day staged canary sequence (#606): see docs/canary-launch-sequence.md.
on:
  pull_request:
    paths: ["services/canary/**", "scripts/canary.sh", "config/canary-assets.txt", ".github/workflows/canary.yml"]
  workflow_dispatch:
    inputs:
      blue_contract:
        description: "Live (blue) contract id"
        required: true
      canary_bps:
        description: "Share of assets routed to green, in basis points"
        default: "1000"
      stage:
        description: "Launch-day canary stage (1, 2, or 3)"
        required: true
        default: "1"

jobs:
  selftest:
    # Proves a deliberately divergent green is caught and rolled back.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q services/canary

  stage-check:
    # Repeatable check that the requested launch-day stage is well-formed and
    # that its canary asset set is a subset of the previous stage (#606).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Validate canary stage sequence
        env:
          CANARY_STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || '1' }}
        run: python -m pytest -q services/canary/test_launch_sequence.py

  canary:
    if: github.event_name == 'workflow_dispatch'
    needs: [selftest, stage-check]
    runs-on: ubuntu-latest
    environment: testnet
    outputs:
      green_contract: ${{ steps.deploy.outputs.green }}
    permissions:
      contents: read
      # Short-lived, OIDC-federated credentials instead of a stored secret
      # (#524). The trust policy pinning this workflow, repository, ref and
      # environment is encoded in services/ci_policy/policy.py and audited by
      # `make ci-audit`; see docs/secretless-ci.md.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none
      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v26.1.0/stellar-cli-26.1.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin
      - name: Exchange OIDC token for a short-lived deploy signer
        id: creds
        env:
          # The role *identifier* is not a secret; the role itself and its trust
          # policy live in the cloud account.
          DEPLOY_ROLE: ${{ vars.TESTNET_DEPLOY_ROLE_ARN }}
          DEPLOY_KEY_NAME: ${{ vars.TESTNET_DEPLOY_KEY_NAME }}
        run: |
          set -euo pipefail
          eval "$(./scripts/federated-deploy-credentials.sh write-key \
            --role "$DEPLOY_ROLE" --key-name "$DEPLOY_KEY_NAME")"
          echo "key_file=$FEDERATED_KEY_FILE" >> "$GITHUB_OUTPUT"
      - name: Build and deploy green
        id: deploy
        env:
          # Empty HOME-scoped identity dir; the key is read from the
          # short-lived file, never from a repository secret.
          STELLAR_KEY_FILE: ${{ steps.creds.outputs.key_file }}
        run: |
          set -euo pipefail
          make build
          stellar keys add canary --secret-key "$(cat "$STELLAR_KEY_FILE")" >/dev/null
          GREEN=$(stellar contract deploy --wasm target/wasm32v1-none/release/price_oracle.wasm \
            --source canary --network testnet)
          echo "green=$GREEN" >> "$GITHUB_OUTPUT"
      - name: Record deployment attribution
        if: always() && steps.deploy.outputs.green != ''
        env:
          GREEN: ${{ steps.deploy.outputs.green }}
          DEPLOY_ROLE: ${{ vars.TESTNET_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          python -m services.ci_policy.attest \
            --repository "${{ github.repository }}" \
            --commit "${{ github.sha }}" \
            --workflow-ref "${{ github.workflow_ref }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --environment testnet \
            --role "$DEPLOY_ROLE" \
            --artifact "${{ hashFiles('target/wasm32v1-none/release/price_oracle.wasm') }}" \
            --actor "${{ github.actor }}" \
            --out deployment-attestation.json
          cat deployment-attestation.json >> "$GITHUB_STEP_SUMMARY"
      - name: Compare per-asset output (rollback on divergence)
        env:
          CANARY_BPS: ${{ inputs.canary_bps }}
          CANARY_STAGE: ${{ inputs.stage }}
        run: |
          scripts/canary.sh testnet canary "${{ inputs.blue_contract }}" \
            "${{ steps.deploy.outputs.green }}" config/canary-assets.txt canary-out
      - name: Retain divergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-record-${{ github.run_id }}
          path: canary-out/
          retention-days: 400

  promote:
    # `production` must have required reviewers configured; GitHub records
    # the approving reviewer on the run, and the job stamps it into the record.
    needs: canary
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: canary-record-${{ github.run_id }}
          path: canary-out
      - name: Record approval
        run: |
          APPROVER=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/approvals" \
            --jq '.[-1].user.login')
          jq --arg who "$APPROVER" --arg stage "${{ inputs.stage }}" \
            '.approved_by = $who | .stage = $stage | .decision = "promoted"' \
            canary-out/deployment-record.json > canary-out/promotion-record.json
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: promotion-record-${{ github.run_id }}
          path: canary-out/promotion-record.json
          retention-days: 400
