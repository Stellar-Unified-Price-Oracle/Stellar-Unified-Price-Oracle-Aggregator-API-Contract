name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin to the exact version in rust-toolchain.toml. Installing via
      # @stable leaves the pinned 1.91.0 override without rustfmt/clippy,
      # which makes `make check` and `make lint` fail with "not installed
      # for the toolchain '1.91.0'".
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: make check
      - name: Build
        run: make build
      - name: Run clippy
        run: make lint
      - name: Gas-budget gates
        run: make gas-gate
      - name: Run tests
        run: make test

  abi-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      # Use a prebuilt stellar-cli release instead of `cargo install
      # --locked stellar-cli`, which compiles from source, needs system
      # libraries the runner image lacks (libdbus-1-dev, pkg-config), and
      # only succeeds with a "^23" resolution that no longer exists.
      - name: Install Stellar CLI (prebuilt binary)
        run: |
          set -euo pipefail
          STELLAR_CLI_VERSION="26.1.0"
          curl -fsSL \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
          stellar --version
      - name: Generate ABI
        run: ./scripts/generate-abi.sh
      - name: Upload generated ABI
        uses: actions/upload-artifact@v4
        with:
          name: contract-abi
          path: docs/abi.json

  attack-regression:
    # #511 — the attack-regression corpus runs as its own job so it can be given
    # an explicit wall-clock budget separate from the rest of the suite.
    name: Attack-regression corpus (time-budgeted)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - name: Run the corpus within budget
        run: make attack-gate

  kani:
    # #512 — bounded formal proofs for the aggregation math. Kani needs a
    # specific toolchain, so this job opts out of rust-toolchain.toml.
    name: Bounded formal proofs (Kani)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Kani is not published on crates.io; the official action installs a
      # matching verifier + toolchain pair. It manages the toolchain itself, so
      # rust-toolchain.toml must not override it.
      - uses: model-checking/kani-github-action@v1
        with:
          args: --tests --harness
      - uses: Swatinem/rust-cache@v2
      # The proofs run under their own bounded domain; the budget is enforced by
      # the script so a proof regression fails fast rather than hanging CI.
      - name: Verify bounded proofs
        run: ./scripts/kani-proofs.sh

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dependencies (licenses, advisories, duplicates, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --config deny.toml

  # #499: price-revision frequency and correction-rate metrics. Pure functions
  # over the indexed event stream; the tests are the contract for the metric.
  # See docs/price-revision-metrics.md.
  revision-metrics:
    name: Revision-rate metrics (#499)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Run revision-metric tests
        run: python -m pytest services/revision_metrics -q
      - name: Smoke-run the metric over a generated stream
        run: |
          python - <<'PY'
          import json, sys
          from services.common.synthetic import generate_submissions
          from services.revision_metrics.metrics import compute_metrics, evaluate_alerts
          events = generate_submissions(n_rounds=50)
          bundle = compute_metrics(events)
          json.dump({k: v.to_dict() for k, v in bundle["assets"].items()}, sys.stdout, indent=2)
          print()
          print(f"alerts: {len(evaluate_alerts(bundle))}")
          PY

  # #500: static analysis and SAST. Fails on a new advisory, on unsafe code
  # beyond the committed baseline, and on an allowlist entry that has lost its
  # owner or expired. The report is uploaded so a failure is triaged from the
  # run page. See docs/static-analysis.md.
  static-analysis:
    name: Static analysis (SAST + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none
      - name: Install cargo-audit and cargo-geiger
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-geiger --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      # Dependency advisories, on top of the existing cargo-deny job.
      - name: cargo audit (RustSec advisories)
        run: |
          cargo audit --file Cargo.lock --json > security-artifacts-cargo-audit.json || true
      # Unsafe-code census for the same lockfile the contract builds with.
      - name: cargo geiger (unsafe usage census)
        run: |
          cargo geiger --output-format Json . > security-artifacts-geiger.json || true
      - name: SAST, baseline and advisory gate
        run: python -m services.static_analysis.gate --report security-artifacts/static-analysis.md
      - name: Run gate tests
        run: python -m pytest services/static_analysis -q
      - name: Publish summary
        if: always()
        run: cat security-artifacts/static-analysis.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-artifacts
          path: security-artifacts/

  # #502: secret scanning. Tree + full history, pre-commit parity, redacted
  # report. See docs/secret-scanning.md (including the rotation playbook).
  secret-scan:
    name: Secret scan (tree + history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # History scanning needs the full graph, not a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Scan working tree and history
        run: >
          python -m services.secret_scan.scanner . --history
          --report secret-artifacts/secret-scan.md
      - name: Run scanner tests
        run: python -m pytest services/secret_scan -q
      - name: Publish summary
        if: always()
        run: cat secret-artifacts/secret-scan.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scan-artifacts
          path: secret-artifacts/

  # #501: exact dependency pins, committed+hashed lockfile, and two clean
  # builds that must produce the same WASM digest. See
  # docs/reproducible-builds.md.
  reproducible-build:
    name: Reproducible build (pins + double build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Every dependency pinned exactly, lockfile in sync
        run: python -m services.pinned_deps.pin_check .
      - name: Two clean builds, compared digests
        run: ./scripts/reproducible-build.sh
      - name: Run pinning tests
        run: python -m pytest services/pinned_deps -q
      - name: Publish summary
        if: always()
        run: cat build-artifacts/reproducible-build.md >> "$GITHUB_STEP_SUMMARY"
      # The digests are the published artifact hashes an independent rebuild is
      # compared against.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: build-artifacts/

  sla-monitor:
    name: SLA monitor (docs/SLA.md consistency + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Check docs/SLA.md matches the monitor clause map
        run: python -m services.sla_monitor.monitor --check-sla
      - name: Run SLA monitor tests
        run: python -m pytest services/sla_monitor -q

  ops-docs:
    name: Ops docs (runbook, postmortems, capacity model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      # #527 every paging alert must have a runbook entry with an owner, a
      # review cadence, and a link from the alert -> entry table.
      - name: Check every paging alert has a runbook entry
        run: python -m services.runbook.check_runbook
      # #528 postmortems must be structured, indexed, and carry action items
      # with owners, due dates and tracking issues.
      - name: Check postmortem structure, index and follow-up
        run: python -m services.incident_review.check_postmortems
      # #529 inventory doc and #530 capacity doc must stay in step with code.
      - name: Run ops service tests (runbook, postmortems, backup, capacity)
        run: python -m pytest services/runbook services/incident_review services/backup services/capacity -q

  fuzz:
    name: Coverage-guided fuzzing (1M iterations)
    runs-on: ubuntu-latest
    # Only run on main / PRs targeting main to keep CI fast on feature branches.
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust (required by cargo-fuzz / libfuzzer-sys)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      # rust-toolchain.toml pins 1.91.0 and would override the nightly
      # toolchain above, so set an explicit directory override (stronger
      # than the toolchain file) for this job only.
      - name: Force nightly for this job
        run: rustup override set nightly

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # 0.12.0 no longer builds on current nightly (its rustix dependency uses
      # reserved `rustc::` attributes). Pin the current 0.13.x line instead.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version "0.13.2"

      # ── Fuzz target 1: differential aggregation ─────────────────────────────
      - name: Fuzz fuzz_aggregation (1 000 000 iterations)
        run: |
          cargo fuzz run fuzz_aggregation \
            fuzz/corpus/fuzz_aggregation \
            -- \
            -runs=1000000 \
            -max_len=816 \
            -timeout=30 \
            -error_exitcode=1
        # 816 bytes = 102 i64 words ≈ 51 prices + 51 weights (just over max sources)

      # ── Fuzz target 2: quickselect invariants ───────────────────────────────
      - name: Fuzz fuzz_quickselect (1 000 000 iterations)
        run: |
          cargo fuzz run fuzz_quickselect \
            fuzz/corpus/fuzz_quickselect \
            -- \
            -runs=1000000 \
            -max_len=809 \
            -timeout=30 \
            -error_exitcode=1
        # 809 bytes = 100 i64 words (800) + 1 byte for k + extra room

      # ── Fuzz target 3: security invariants for trimmed mean / VWAP / weighted median (#409)
      - name: Fuzz fuzz_aggregation_invariants (1 000 000 iterations)
        run: |
          cargo fuzz run fuzz_aggregation_invariants \
            fuzz/corpus/fuzz_aggregation_invariants \
            -- \
            -runs=1000000 \
            -max_len=401 \
            -timeout=30 \
            -error_exitcode=1
        # 401 bytes = 1 trim byte + 100 i32 words (50 prices + 50 volumes)

      # ── Fuzz target 4: public endpoint surface (#504) ──────────────────────
      # Unlike the three targets above, which only reach `core_pricing` /
      # `storage`, this one drives the contract's public endpoints with
      # type-directed fuzz input and asserts the security invariants
      # (INV-NO-PANIC, INV-AUTH, INV-NO-GROWTH). The covered surface is pinned
      # by `fuzz/endpoint_manifest.txt`, checked against `lib.rs` in both
      # directions by `fuzz_coverage_tests`.
      - name: Fuzz fuzz_endpoints (1 000 000 iterations)
        run: |
          cargo fuzz run fuzz_endpoints \
            fuzz/corpus/fuzz_endpoints \
            -- \
            -runs=1000000 \
            -max_len=512 \
            -timeout=30 \
            -error_exitcode=1
        # 512 bytes is comfortably above the 64-byte minimum input and the
        # 32-byte salt cap the harness decodes, with room for libFuzzer to grow.

      # ── Upload any crash artifacts ───────────────────────────────────────────
      - name: Upload fuzz artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            fuzz/artifacts/
            fuzz/corpus/

  # #519: hermetic integration harness. One command, no network, deterministic
  # across repeated runs. Runs on every PR so integration coverage no longer
  # depends on a shared testnet.
  hermetic-integration:
    name: Hermetic integration harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run harness (twice, verifying determinism)
        run: ./scripts/hermetic-integration.sh
      - name: Publish summary
        if: always()
        run: cat hermetic-artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"
      # Logs and Soroban ledger snapshots, so a failure can be diagnosed from
      # CI without re-running locally.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermetic-integration-artifacts
          path: hermetic-artifacts/
