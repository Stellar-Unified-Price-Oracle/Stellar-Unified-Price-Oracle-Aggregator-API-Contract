name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"   # weekly: external-link check (#540)

env:
  CARGO_TERM_COLOR: always

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin to the exact version in rust-toolchain.toml. Installing via
      # @stable leaves the pinned 1.91.0 override without rustfmt/clippy,
      # which makes `make check` and `make lint` fail with "not installed
      # for the toolchain '1.91.0'".
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: make check
      - name: Build
        run: make build
      - name: Run clippy
        run: make lint
      - name: Gas-budget gates
        run: make gas-gate
      - name: Per-endpoint budgets (#692)
        run: make endpoint-budgets
      - name: Run tests
        run: make test

  # #608: production network protocol compatibility matrix. The contract suite
  # runs once per declared supported (Soroban protocol, SDK) combination so an
  # unverified combination blocks the release. The matrix is the single source
  # of truth in docs/protocol-compatibility.md; keep the two in sync.
  compatibility-matrix:
    name: Compatibility (${{ matrix.target }} / protocol ${{ matrix.protocol }} / sdk ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: local
            protocol: "23"
            sdk: "23.0.0"
          - target: testnet
            protocol: "23"
            sdk: "23.0.0"
          - target: futurenet
            protocol: "23"
            sdk: "23.0.0"
          - target: mainnet
            protocol: "23"
            sdk: "23.0.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      # Pin the Soroban SDK to the combination under test. The manifest must
      # already declare this version; a mismatch fails the job rather than
      # silently testing a different SDK than the matrix claims.
      - name: Verify declared Soroban SDK version
        run: |
          set -euo pipefail
          declared=$(grep -E '^soroban-sdk\s*=' Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "declared soroban-sdk: ${declared}"
          echo "matrix sdk: ${{ matrix.sdk }}"
          if [ "${declared}" != "${{ matrix.sdk }}" ]; then
            echo "::error::soroban-sdk ${declared} does not match matrix sdk ${{ matrix.sdk }}"
            exit 1
          fi
      - name: Build
        run: make build
      - name: Run contract suite for combination
        env:
          SOROBAN_PROTOCOL_VERSION: ${{ matrix.protocol }}
          SOROBAN_SDK_VERSION: ${{ matrix.sdk }}
          DEPLOYMENT_TARGET: ${{ matrix.target }}
        run: make test

  # #515/#516/#517/#518: the verification suites. Each one is a plain
  # `cargo test` filter over the contract's test binary, so they are cheap
  # enough to run on every pull request. `make conformance` runs all four.
  conformance:
    name: Conformance, determinism, upgrade matrix, event snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      # The suite that reads the built WASM (test.rs) needs it to exist, so
      # build first, exactly like the `contract` job above.
      - name: Build
        run: make build
      - name: SEP-40 conformance (#515)
        run: make sep40-conformance
      - name: Determinism and interleaving (#516)
        run: make interleaving
      - name: N-2..N upgrade matrix (#517)
        run: make version-matrix
      # Check only. Regeneration is a deliberate, reviewed step
      # (`make event-snapshots-regen`), never part of CI.
      - name: Golden event-schema snapshots (#518)
        run: make event-snapshots

  abi-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      # Use a prebuilt stellar-cli release instead of `cargo install
      # --locked stellar-cli`, which compiles from source, needs system
      # libraries the runner image lacks (libdbus-1-dev, pkg-config), and
      # only succeeds with a "^23" resolution that no longer exists.
      - name: Install Stellar CLI (prebuilt binary)
        run: |
          set -euo pipefail
          STELLAR_CLI_VERSION="26.1.0"
          curl -fsSL \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
          stellar --version
      - name: Generate ABI
        run: ./scripts/generate-abi.sh
      - name: Upload generated ABI
        uses: actions/upload-artifact@v4
        with:
          name: contract-abi
          path: docs/abi.json

  attack-regression:
    # #511 — the attack-regression corpus runs as its own job so it can be given
    # an explicit wall-clock budget separate from the rest of the suite.
    name: Attack-regression corpus (time-budgeted)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - name: Run the corpus within budget
        run: make attack-gate

  kani:
    # #512 — bounded formal proofs for the aggregation math. Kani needs a
    # specific toolchain, so this job opts out of rust-toolchain.toml.
    name: Bounded formal proofs (Kani)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Kani is not published on crates.io; the official action installs a
      # matching verifier + toolchain pair. It manages the toolchain itself, so
      # rust-toolchain.toml must not override it.
      - uses: model-checking/kani-github-action@v1
        with:
          args: --tests --harness
      - uses: Swatinem/rust-cache@v2
      # The proofs run under their own bounded domain; the budget is enforced by
      # the script so a proof regression fails fast rather than hanging CI.
      - name: Verify bounded proofs
        run: ./scripts/kani-proofs.sh

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dependencies (licenses, advisories, duplicates, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --config deny.toml

  # #499: price-revision frequency and correction-rate metrics. Pure functions
  # over the indexed event stream; the tests are the contract for the metric.
  # See docs/price-revision-metrics.md.
  revision-metrics:
    name: Revision-rate metrics (#499)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Run revision-metric tests
        run: python -m pytest services/revision_metrics -q
      - name: Smoke-run the metric over a generated stream
        run: |
          python - <<'PY'
          import json, sys
          from services.common.synthetic import generate_submissions
          from services.revision_metrics.metrics import compute_metrics, evaluate_alerts
          events = generate_submissions(n_rounds=50)
          bundle = compute_metrics(events)
          json.dump({k: v.to_dict() for k, v in bundle["assets"].items()}, sys.stdout, indent=2)
          print()
          print(f"alerts: {len(evaluate_alerts(bundle))}")
          PY

  # #500: static analysis and SAST. Fails on a new advisory, on unsafe code
  # beyond the committed baseline, and on an allowlist entry that has lost its
  # owner or expired. The report is uploaded so a failure is triaged from the
  # run page. See docs/static-analysis.md.
  static-analysis:
    name: Static analysis (SAST + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none
      - name: Install cargo-audit and cargo-geiger
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-geiger --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      # Dependency advisories, on top of the existing cargo-deny job.
      - name: cargo audit (RustSec advisories)
        run: |
          cargo audit --file Cargo.lock --json > security-artifacts-cargo-audit.json || true
      # Unsafe-code census for the same lockfile the contract builds with.
      - name: cargo geiger (unsafe usage census)
        run: |
          cargo geiger --output-format Json . > security-artifacts-geiger.json || true
      - name: SAST, baseline and advisory gate
        run: python -m services.static_analysis.gate --report security-artifacts/static-analysis.md
      - name: Run gate tests
        run: python -m pytest services/static_analysis -q
      - name: Publish summary
        if: always()
        run: cat security-artifacts/static-analysis.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-artifacts
          path: security-artifacts/

  # #502: secret scanning. Tree + full history, pre-commit parity, redacted
  # report. S

