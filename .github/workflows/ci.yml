name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  consumer-fixtures:
    name: Consumer integration fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run shared fixture library tests
        run: cargo test -p oracle-fixtures

      - name: Run example consumer A against shared fixtures
        run: cargo test -p oracle-fixtures --test consumer_a

      - name: Run example consumer B against shared fixtures
        run: cargo test -p oracle-fixtures --test consumer_b
