name: DevX

on:
  push:
  pull_request:

jobs:
  registry-and-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Error registry is complete, current and stable
        run: python3 scripts/devx/gen_error_registry.py --check
      - name: Interface artifact is current and follows semver
        run: python3 scripts/devx/gen_interface.py --check
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
      - name: API reference is current
        run: python3 scripts/devx/gen_api_reference.py --check
      - name: Deprecation window + deprecated usage lint
        run: python3 scripts/devx/lint_deprecated.py
      - name: Interface package packs
        working-directory: interface
        run: npm pack --dry-run

  # #843: lint, typecheck and test the JS/TS packages. Only runs when one of
  # the JS/TS paths changes (or the workflow itself), so Rust-only PRs stay fast.
  js-ts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [sdk/typescript, interface, explorer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Lint (eslint)
        working-directory: ${{ matrix.package }}
        run: npm run lint --if-present
      - name: Typecheck (tsc --noEmit)
        working-directory: ${{ matrix.package }}
        run: npm run typecheck --if-present
      - name: Test
        working-directory: ${{ matrix.package }}
        run: npm test --if-present

  # #843: lint, typecheck and test the JS/TS packages. Only runs when one of
  # the JS/TS paths changes (or the workflow itself), so Rust-only PRs stay fast.
  js-ts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [sdk/typescript, interface, explorer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Lint (eslint)
        working-directory: ${{ matrix.package }}
        run: npm run lint --if-present
      - name: Typecheck (tsc --noEmit)
        working-directory: ${{ matrix.package }}
        run: npm run typecheck --if-present
      - name: Test
        working-directory: ${{ matrix.package }}
        run: npm test --if-present

  templates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [web, indexer, typescript-dapp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - working-directory: examples/${{ matrix.template }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npm test

  python-quickstarts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [examples/python-bot, examples/python-script]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - working-directory: ${{ matrix.dir }}
        run: pip install -r requirements.txt && pytest -q

  rust-consumer-quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Test Rust consumer quickstart
        run: cargo test --manifest-path examples/rust-consumer/Cargo.toml

  # #841: one job for all Python — ruff, mypy and pytest over services/,
  # scripts/ and sdk/python. Config lives in the root pyproject.toml; the
  # toolchain is installed from the hashed lockfile.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dev tooling
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Ruff
        run: ruff check services scripts sdk/python
      - name: Mypy
        run: mypy
      - name: Pytest
        run: python -m pytest -q
