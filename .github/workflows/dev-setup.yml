name: Dev setup (clean runner)

# #541: a fresh clone must reach a passing test run with one command.
on:
  schedule:
    - cron: "0 6 * * 1"   # weekly, to catch rot
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/dev-setup.sh
      - rust-toolchain.toml
      - Cargo.lock
      - scripts/requirements.txt
      - package-lock.json
      - .github/workflows/dev-setup.yml

jobs:
  one-command:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Remove pre-installed Rust so the script provisions from scratch
        run: rm -rf "$HOME/.rustup" "$HOME/.cargo"
      - name: One-command setup and full test run
        run: ./scripts/dev-setup.sh
