name: Deploy Explorer

on:
  push:
    branches: [main]
    paths:
      - "explorer/**"
      - ".github/workflows/explorer-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Configure testnet endpoint
        env:
          TESTNET_CONTRACT_ID: ${{ vars.ORACLE_TESTNET_CONTRACT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "rpcUrl": "https://soroban-testnet.stellar.org",
              "contractId": os.environ.get("TESTNET_CONTRACT_ID", "").strip(),
          }
          Path("explorer/runtime-config.js").write_text(
              "window.ORACLE_EXPLORER_CONFIG = Object.freeze("
              + json.dumps(config)
              + ");\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: explorer
      - id: deployment
        uses: actions/deploy-pages@v5
