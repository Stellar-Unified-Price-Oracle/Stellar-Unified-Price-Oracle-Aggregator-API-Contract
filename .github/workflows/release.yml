name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-evidence:
    name: Mainnet release evidence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify go/no-go evidence checklist
        run: scripts/check-release-evidence.sh docs/mainnet-release-checklist.md

  # #833 — tag-triggered release: canonical (containerized) build, optimize,
  # checksum, GitHub Release with the WASM + hash + interface JSON + changelog,
  # and a build provenance attestation for the published artifact.
  release:
    name: Build and publish release
    needs: release-evidence
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # keyless attestation signing
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag matches interface version
        run: |
          set -euo pipefail
          test "v$(node -p 'require("./interface/package.json").version')" = "${GITHUB_REF_NAME}"

      - name: Build WASM in the canonical container
        run: |
          set -euo pipefail
          docker build -f docker/Dockerfile.canonical-build -t price-oracle-build .
          docker run --rm -v "$PWD":/src -w /src price-oracle-build

      - name: Install Stellar CLI (prebuilt binary)
        run: |
          set -euo pipefail
          STELLAR_CLI_VERSION="26.1.0"
          curl -fsSL \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
          stellar --version

      - name: Optimize WASM
        run: |
          set -euo pipefail
          mkdir -p dist
          stellar contract optimize \
            --wasm target/wasm32v1-none/release/price_oracle.wasm \
            --wasm-out dist/price_oracle.wasm

      - name: Compute SHA-256
        run: |
          set -euo pipefail
          cd dist
          sha256sum price_oracle.wasm > price_oracle.wasm.sha256
          cat price_oracle.wasm.sha256

      - name: Collect release assets
        run: |
          set -euo pipefail
          cp interface/interface.json dist/interface.json
          cp interface/versions.json dist/versions.json
          {
            echo "# ${GITHUB_REF_NAME}"
            echo
            echo "Contract WASM: \`price_oracle.wasm\`"
            echo "SHA-256: \`$(cut -d' ' -f1 dist/price_oracle.wasm.sha256)\`"
            echo
            echo "## Changes"
            echo
            git log --no-merges --pretty='- %s (%h)' "$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)"..HEAD
          } > dist/CHANGELOG.md
          ls -l dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/price_oracle.wasm

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: dist/CHANGELOG.md
          files: |
            dist/price_oracle.wasm
            dist/price_oracle.wasm.sha256
            dist/interface.json
            dist/versions.json
            dist/CHANGELOG.md
          fail_on_unmatched_files: true
