name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-evidence:
    name: Mainnet release evidence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify go/no-go evidence checklist
        run: scripts/check-release-evidence.sh docs/mainnet-release-checklist.md
