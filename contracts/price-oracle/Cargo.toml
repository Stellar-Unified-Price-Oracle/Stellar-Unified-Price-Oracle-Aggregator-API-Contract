[package]
name = "price-oracle"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
# Expose pure core module for fuzzing (disables WASM-only restrictions).
fuzz = []
# Enables the host-only helper paths in `gas_metering.rs` that need the
# soroban-sdk budget API. Test builds get them via `cfg(test)` as well.
testutils = []

[dependencies]
soroban-sdk = { version = "26" }

[dev-dependencies]
soroban-sdk = { version = "26", features = ["testutils"] }
proptest = { version = "1.5.0", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }

