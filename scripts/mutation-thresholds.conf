# Per-module mutation-score thresholds (#520).
#
# Format:  <module>=<threshold>
#   <module>     space-separated source files belonging to the module
#   <threshold>  minimum kill rate in percent, as an integer
#
# Why per module rather than one aggregate number: an oracle's risk is not
# uniform across its files. A weak suite in `storage.rs` can be masked by a
# large, well-covered surface elsewhere, and the masked module is usually the
# security-critical one. Per-module thresholds make that visible.
#
# Rule of thumb: security-critical modules are held to a high bar, and the bar
# is only ever raised in a change that also adds the tests to meet it. Lowering
# a threshold needs a written justification in the PR and, for an equivalent-
# mutant waiver, an entry in mutation-waivers.txt.
#
# Anything not listed here is covered by the `general` threshold in
# mutation-gate.sh.

# --- Security-critical: aggregation, auth, storage -------------------------
#
# A surviving mutant here is a silent correctness or authorization bug, so
# these are held well above the general bar.
#
# `storage` is the highest bar because it holds both the storage round-trip
# layer (#521) and the TTL/rent boundaries (#522): a mutant there can corrupt
# a persisted value or let an expired key read as live, and neither shows up
# as a failed assertion elsewhere.
storage storage.rs=95

# Aggregation: the median/mean/trimmed-mean math and the submission path that
# feeds it. A mutation here publishes a wrong price that still looks valid.
aggregation prices.rs=90
aggregation sources.rs=90

# Auth: the allow-lists and role checks. A mutation here is an authorization
# bypass, which is the highest-severity class of bug in this contract.
auth rbac.rs=90
auth admin.rs=90

# --- Supporting modules ----------------------------------------------------
# Supporting, but still above the general bar: a failure in either silently
# weakens the guarantees the modules above depend on.
finality finality.rs=85
migration migration.rs=85

# --- General fallback ------------------------------------------------------
# Applied to every file not named above (see GENERAL_THRESHOLD).
