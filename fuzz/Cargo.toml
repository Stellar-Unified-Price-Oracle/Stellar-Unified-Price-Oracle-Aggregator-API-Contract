[package]
name = "price-oracle-fuzz"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "fuzz_aggregation"
path = "fuzz_targets/fuzz_aggregation.rs"
test = false
bench = false
doc = false

[[bin]]
name = "fuzz_quickselect"
path = "fuzz_targets/fuzz_quickselect.rs"
test = false
bench = false
doc = false

[dependencies]
# libfuzzer-sys provides the `fuzz_target!` macro and the AFL/libFuzzer harness.
libfuzzer-sys = { version = "0.4.7", features = [] }
# The differential targets build `soroban_sdk::Vec` values and drive them through
# the SDK-side aggregation wrappers, so the SDK has to be a direct dependency.
# `testutils` gives us a host `Env` with real (non-contract) storage/alloc.
soroban-sdk = { version = "26", features = ["testutils"] }
# Pull in the pure core functions from the contract crate.
price-oracle = { path = "../contracts/price-oracle", features = ["fuzz"] }

[profile.release]
# Optimise for fuzzing: keep symbols + debug info for better crash reproduction.
debug = 1
opt-level = 3
